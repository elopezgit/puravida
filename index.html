      rel="stylesheet"
    />

    <!-- CurtainBg / marca inicial mientras carga el motor tipografico -->
    <style>
      html { background: #0b0906; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #0b0906;
        transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.1s;
      }
      #boot[data-done='1'] { opacity: 0; pointer-events: none; }
      #boot b {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 300;
        font-size: 12px;
        letter-spacing: 0.5em;
        color: #d6ae6a;
        text-transform: uppercase;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot { display: none; }
      }
    </style>

    <!--
      Red de seguridad del curtain.

      #boot se saca cuando el Preloader de React avisa que terminó. Si el JS
      llegara a fallar —bundle roto, error de red, extensión bloqueando
      scripts— nadie lo saca y la página queda en negro para siempre, sin
      explicar por qué. Este script lo levanta igual, pasado un plazo.

      4,2 s es posterior al recorrido normal del Preloader (2,4 s), así que en
      el caso sano no hace nada. El curtain además tiene `pointer-events: none`
      al apagarse, así que nunca frena el scroll aunque quede el nodo.
    -->
    <script>
      ;(function () {
        function lift() {
          var b = document.getElementById('boot')
          if (!b) return
          b.setAttribute('data-done', '1')
          window.setTimeout(function () {
            b.parentNode && b.parentNode.removeChild(b)
          }, 800)
        }
        /* Si el documento terminó de cargar y el curtain sigue puesto, algo
           falló: se levanta igual para no dejar la web en negro. */
        if (document.readyState === 'complete') window.setTimeout(lift, 1200)
        else window.addEventListener('load', function () { window.setTimeout(lift, 1200) })
        /* Y un plazo máximo, por si el evento load nunca llega. */
        window.setTimeout(lift, 4200)
      })()
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><b>Pura Vida</b></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
